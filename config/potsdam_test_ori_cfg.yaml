DATASET:
  NAME: 'potsdam'
  NUM_CLASSES: 6
  DATAROOT: '...'
  SCALE: [448, 448]
  RATIO_RANGE: [1.0, 1.0]
  CROP_SIZE: [448, 448]
  CAT_MAX_RATIO: 0.75
  IMG_NORM_CFG:
    MEAN: [123.675, 116.28, 103.53]
    STD: [58.395, 57.12, 57.375]
    RGB: True
  TEXT_WEIGHT: 'text/potsdam_ViT16_clip_text.pth'
  REDUCE_ZERO_LABEL: False
  IGNORE_INDEX: 255
  PALETTE: [
    [255, 0, 0],    # 背景（0）
    [255, 255, 255], # 不透水层（1）
    [0, 0, 255],    # 建筑物（2）
    [0, 255, 255],  # 低植被（3）
    [0, 255, 0],    # 树木（4）
    [255, 255, 0]   # 汽车（5）
    ]

MODEL:
  USE_MULTISCALE: True
  MULTISCALE_COMPRESS_DIM: 256
  MULTISCALE_WARMUP_EPOCHS: 10
  MULTISCALE_LR_MULTIPLIER: 0.1
  MAX_SCALE: 0.3
  USE_FASB: True
  FASB_LOW_FREQ_THRESHOLD: 0.2
  FASB_LR_MULTIPLIER: 1.0 

  FEATURE_EXTRACTOR: 'vit'
  TEXT_CHANNEL: 512
  VISUAL_CHANNEL: 768
  TRAINING: False

TEST:
  BATCH_SIZE: 1
  PD : 0.5
  ReCLIP_PD: 0.6

EVAL_METRIC: "miou"
LOAD_PATH: "..."
SAVE_DIR: "..."
NUM_WORKERS: 4
