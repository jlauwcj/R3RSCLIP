DATASET:
  NAME: 'potsdam'
  NUM_CLASSES: 6
  DATAROOT: '...'
  SCALE: [448, 448]
  RATIO_RANGE: [1.0, 1.0]
  CROP_SIZE: [448, 448]
  CAT_MAX_RATIO: 0.75
  IMG_NORM_CFG:
    MEAN: [123.675, 116.28, 103.53]
    STD: [58.395, 57.12, 57.375]
    RGB: True
#    MEAN: [ 122.771, 116.746, 104.094 ]
#    STD: [ 68.501, 66.632, 70.323 ]
#    RGB: True
  TEXT_WEIGHT: 'text/potsdam_ViT16_clip_text.pth'
  K: 5
  THRESHOLD: 18
  REDUCE_ZERO_LABEL: False
  IGNORE_INDEX: 255

MODEL:
  USE_MULTISCALE: True
  MULTISCALE_COMPRESS_DIM: 256
  MULTISCALE_WARMUP_EPOCHS: 10
  MULTISCALE_LR_MULTIPLIER: 0.1
  MAX_SCALE: 0.3
  USE_FASB: True
  FASB_LOW_FREQ_THRESHOLD: 0.2
  FASB_LR_MULTIPLIER: 1.0 

  FEATURE_EXTRACTOR: 'vit'
  TEXT_CHANNEL: 512
  VISUAL_CHANNEL: 768
  TRAINING: True

TRAIN:
  BATCH_SIZE: 16
  MAX_EPOCH: 300
  EPOCH: 100
  LR: 0.005

TEST:
  BATCH_SIZE: 1

EVAL_METRIC: "miou"
LOAD_PATH: "..."
SAVE_DIR: "..."
NUM_WORKERS: 4
